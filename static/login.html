<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - CampusConnect</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-page">
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-logo-badge">🎓 CampusConnect</div>
          <h2>Welcome Back</h2>
          <p class="auth-subtitle">Sign in to track and report campus issues</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">Campus Email</label>
            <input
              type="email"
              id="email"
              placeholder="e.g. student@campus.edu"
              required
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            />
          </div>

          <button type="submit" class="button primary-button auth-btn">
            Sign In
          </button>
        </form>

        <p id="errorMsg" class="auth-error"></p>

        <div class="auth-footer">
          <p>Don't have an account? <a href="/register.html">Create one here</a></p>
        </div>
      </div>
    </div>
    <script src="auth.js"></script>
  </body>
</html>
