<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - CampusConnect</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">CampusConnect</div>
      <div class="navlinks">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/create.html">Report an issue</a>
        <a href="/profile.html" class="active-nav">Profile</a>
        <button onclick="logout()" class="logout-btn">Logout</button>
      </div>
    </nav>

    <main class="box profile-main">
      <div class="profile-card-modern">
        <!-- Banner Header -->
        <div class="profile-banner">
          <div class="profile-avatar-circle">
            <span class="profile-avatar-icon">🎓</span>
          </div>
        </div>

        <!-- User Info Body -->
        <div class="profile-body">
          <div class="profile-title-row">
            <div>
              <h1 class="profile-name" id="name">Loading student...</h1>
              <span class="profile-badge">Student Member</span>
            </div>
            <button onclick="logout()" class="button secondary-button profile-logout-action">
              Log Out
            </button>
          </div>

          <div class="profile-grid">
            <div class="profile-info-tile">
              <span class="profile-tile-label">Campus Email</span>
              <span class="profile-tile-value" id="email">—</span>
            </div>

            <div class="profile-info-tile">
              <span class="profile-tile-label">Member Since</span>
              <span class="profile-tile-value" id="joined">—</span>
            </div>

            <div class="profile-info-tile">
              <span class="profile-tile-label">Account Role</span>
              <span class="profile-tile-value">
                <span class="status-badge status-resolved">Active Student</span>
              </span>
            </div>
          </div>

          <!-- Quick Navigation Actions -->
          <div class="profile-quick-actions">
            <h3>Quick Actions</h3>
            <div class="quick-actions-btns">
              <a href="/create.html" class="button primary-button">Report a New Issue</a>
              <a href="/dashboard.html" class="button secondary-button">Go to Dashboard</a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="api.js"></script>
    <script src="profile.js"></script>
  </body>
</html>
