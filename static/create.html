<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect - Report an Issue</title>
    <link rel="stylesheet" href="style.css">

</head>


<body>
    <!--navigation bar-->
    <nav class="navbar">
        <div class="logo">CampusConnect</div>
                    <div class="navlinks">

            <a href="dashboard.html"> Dashboard</a>
            <a href="create.html">Report an Issue</a>
            <a href="profile.html">Profile</a>
        </div>
    </nav>

    <main class="box">
        <section class="form-section">           
            <div class="page-header">
                <!--section to create an issue-->
                <div>
                    <h1>Report an Issue</h1>
                    <p> Report a problem or issue on campus.</p>
                </div>
            </div>
            <!--Issue form-->
                        <form id="issueForm">
                <div class="form-group">
                    <label for="title">Issue Title</label>                       
                    <input type="text" id="title" name="title" placeholder="Enter issue title" required>
                </div>              

                <div class="form-group">
                    <label for="description">Description</label>
                       
                    <textarea id="description" name="description" rows="6" placeholder="Describe the issue..." required></textarea>
                </div>
                <div class="form-group">
                    <!--for the selection of issue category-->
                    <label for="category">Category</label>
                    <select id="category" name="category" required >
                        <option value="">Select a category</option>
                       <option value="Classroom">Classroom</option>
                        <option value="Campus">Campus</option>                            
                        <option value="Lost&Found">Lost&Found</option>
                        <option value="Digital IT Services"> Digital IT Services</option>
                        <option value="General">General</option>
                    </select>
                </div>
                <p id="formError" class="message error-message hidden"></p>
                <p id="formSuccess" class="message success-message hidden"></p>
                <div class="form-actions">
                    <a href="dashboard.html" class="button secondary-button">Cancel</a>
                    <button type="submit" class="button primary-button">Submit Issue</button>
                </div>
            </form>
        </section>
    </main>

<script src="create.js"></script>
</body>

</html>
